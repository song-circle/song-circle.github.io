<!doctype html>
<!--
  ※ 법률 검토 전 초안 — 게임별 개인정보처리방침 템플릿
  스토어 제출 전에 실제로 수집하는 정보와 사용하는 SDK(광고·애널리틱스 등)에 맞게
  data/games.js 의 privacy 항목을 채우고, 가능하면 전문가 검토를 받으세요.

  사용법: 이 파일을 /games/<slug>/privacy/index.html 로 복사한 뒤 {{slug}}, {{title}} 을 바꾸세요.
  본문은 data/games.js 의 privacy 데이터로 렌더링됩니다.
-->
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} 개인정보처리방침 | song-circle</title>
  <meta name="description" content="{{title}} 개인정보처리방침">
  <link rel="canonical" href="https://song-circle.github.io/games/{{slug}}/privacy/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{title}} 개인정보처리방침">
  <meta property="og:url" content="https://song-circle.github.io/games/{{slug}}/privacy/">
  <meta property="og:image" content="https://song-circle.github.io/assets/og.png">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body data-page="game-privacy" data-slug="{{slug}}">
  <header id="site-header" class="site-header"></header>
  <main id="main"><div id="page"></div></main>
  <footer id="site-footer" class="site-footer"></footer>

  <script src="/data/site.js"></script>
  <script src="/data/i18n.js"></script>
  <script src="/data/games.js"></script>
  <script src="/assets/js/core.js"></script>
  <script src="/assets/js/games.js"></script>
</body>
</html>
